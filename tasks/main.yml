---
- name: Ensure we have at least one protocol enabled
  ansible.builtin.assert:
    that:
      - wg_ipv6_enable | bool or wg_ipv4_enable | bool
    fail_msg: >
      Neither IPv4 nor IPv6 seems enabled, exiting.

- name: Ensure packages are available
  ansible.builtin.package:
    name: "{{ wg_packages }}"
    state: present

- name: Add tunnel profiles to clients
  ansible.builtin.set_fact:
    _wg_clients: >-
      {{
        _wg_clients
        | default([])
        | union(
          [
            client | combine(
              {
                'profiles': wg_client_tunnel_flavors,
                'addresses':
                  ([wg_tunnel_prefix_ipv6 | ansible.utils.nthhost(client.host_id | default((2**(128 - (wg_tunnel_prefix_ipv6 | ansible.utils.ipaddr('prefix'))) | int) | random(seed=client.id, start=2))) ~ '/128'])
                  | union(
                    [wg_tunnel_prefix_ipv4 | ansible.utils.nthhost(client.host_id | default((2**(32 - (wg_tunnel_prefix_ipv4 | ansible.utils.ipaddr('prefix'))) | int) | random(seed=client.id, start=2))) ~ '/32']
                  )
              }
            )
          ]
        )
      }}
  loop: "{{ wg_clients }}"
  loop_control:
    loop_var: client
    label: "{{ label }}"
  tags: always
  vars:
    label: "{{ client.cn | default(client.mail) | default(client.id) }}"

- name: Ensure wireguard configuration file is available
  ansible.builtin.template:
    src: config.conf.j2
    dest: "{{ wg_config_file }}"
    trim_blocks: true
    lstrip_blocks: true
    mode: "0640"
    owner: root
    group: root
  notify: wireguard_restart

- name: Check for kernel debug file
  ansible.builtin.stat:
    path: "{{ wg_kernel_debug_control_file }}"
  register: ddbg

- name: Ensure systemd unit file is overriden/available
  ansible.builtin.template:
    src: systemd_unit.j2
    dest: /etc/systemd/system/wg-quick@.service
    mode: "0644"
    owner: root
    group: root
  tags: wg
  notify: wireguard_restart

- name: Ensure wireguard is started and enabled
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wg_tunnel_iface }}"
    state: started
    enabled: true

- name: Include profile export tasks
  ansible.builtin.include_tasks:
    file: "export_profiles_{{ wg_export_profiles }}.yml"
  loop: "{{ _wg_clients }}"
  loop_control:
    loop_var: client
    label: "{{ label }}"
  vars:
    label: "{{ client.cn | default(client.mail) | default(client.id) }}"
  args:
    apply:
      become: false
      delegate_to: localhost
  when:
    - wg_export_profiles is defined
    - wg_export_profiles is in wg_export_profiles_list

- name: Ensure wg-peers script is available
  ansible.builtin.template:
    src: wg-peers.py.j2
    dest: "{{ wg_peers_script_path }}"
    mode: "0700"
